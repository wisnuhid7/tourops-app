kind: pipeline
type: exec
name: build-image

platform:
  os: linux
  arch: amd64

steps:
  # Langkah 1: Build dan Push Image ke Registry
  - name: build-and-push-registry
    commands:
    - echo "build image docker"
    - docker build -t zot.aidigicube.com/tourops:latest . 
    - echo "build selesai"
    - echo "push image to registry"
    - docker push zot.aidigicube.com/tourops:latest
    - echo "pushed image successfully "

trigger:
  branch:
    - main
  event:
    - push

--- # <-- PEMISAH DOKUMEN WAJIB UNTUK MULTI-PIPELINE

kind: pipeline
type: exec
name: deploy-and-run

# WAJIB: Memaksa pipeline ini menunggu 'build-image' selesai dengan sukses
depends_on:
  - build-image 

platform:
  os: linux
  arch: amd64

steps:
  # Langkah 2: Eksekusi Docker Compose di Remote Server via SSH
  - name: deploy-via-docker-compose
    commands:
    - cd /home/devteam/tourops
    - echo "Menarik image v1.0 terbaru dari Docker Registry..."
    - docker compose pull
    - echo "Menjalankan ulang stack kontainer..."
    - docker compose up app -d 
    - echo "Pruning image lama yang tidak digunakan..."
    - docker image prune -f
    - echo "Deployment via Docker Compose berhasil!"

trigger:
  branch:
    - main
  event:
    - promote
    - push
    - custom 