kind = "web"
previewPath = "/"
title = "TourOps"
version = "1.0.0"
id = "artifacts/tourops"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24174

[services.development]
run = "pnpm --filter @workspace/tourops run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tourops", "run", "build" ]
serve = "static"
publicDir = "artifacts/tourops/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24174"
BASE_PATH = "/"
