services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "tour_ops_2026"
      POSTGRES_DB: tourops
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"

  api-server:
    build:
      context: .
      dockerfile: ./artifacts/api-server/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "5001:5001"
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:tour_ops_2026@postgres:5432/tourops
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=c1e7e8030218fdc02cde24181d0eb51d5c6a5981209ee6bc
      - SEED_SECRET=c1e7e8030218fdc02cde24181d0eb51d5c6a5981209ee6bc
      - PAYMENT_PROVIDER=stripe
      - STRIPE_SECRET_KEY=rk_test_51UGg0aEP0iRGQbxg7BeV4lDCxLyR4GGCRhPfsZ31zSTZWzn7DyVrN5D6Gd4BekjovcaiLy7gVOdBbZCXum9FVEx400IIEzWnrK
      - STRIPE_PUBLISHABLE_KEY=pk_test_51UGg0aEP0iRGQbxg3GhWLBmDwjlRQvVOw3yQYDrpmZS0XmRGA34be2NWL0D9atUl0xvN0oSog1DnT0Q6Z6QN922Q00bTxqEoj4
      - STRIPE_WEBHOOK_SECRET=sk_test_51UGg0aEP0iRGQbxgFaIRpI0sziR0uUq7oWVCm0l7W0d9tcly4fDVms3IBnIlenShdu7AkRMxnFiHohzSTRUMfghb00ZVgHwh5N

  web:
    build:
      context: .
      dockerfile: ./artifacts/tourops/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api-server
    environment:
      - VITE_API_BASE_URL=http://api-server:5001

volumes:
  db_data:
  redis_data:
