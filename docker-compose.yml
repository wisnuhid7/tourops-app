services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "tour_ops_2026"
      POSTGRES_DB: tourops
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"

  api-server:
    build:
      context: .
      dockerfile: ./artifacts/api-server/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "5001:5001"
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:tour_ops_2026@postgres:5432/tourops
      - REDIS_URL=redis://redis:6379

  web:
    build:
      context: .
      dockerfile: ./artifacts/tourops/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-server
    environment:
      - VITE_API_BASE_URL=http://api-server:5001

volumes:
  db_data:
  redis_data:
